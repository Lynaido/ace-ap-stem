version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aas-postgres
    environment:
      POSTGRES_USER: aas_user
      POSTGRES_PASSWORD: aas_local_password
      POSTGRES_DB: aas_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aas_user -d aas_local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aas-network

  # Redis Cache (for BullMQ job queue)
  redis:
    image: redis:7-alpine
    container_name: aas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aas-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: aas-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      API_BASE_URL: http://localhost:3001
      DATABASE_URL: postgresql://aas_user:aas_local_password@postgres:5432/aas_local?schema=public
      DIRECT_URL: postgresql://aas_user:aas_local_password@postgres:5432/aas_local?schema=public
      JWT_SECRET: local-dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 60m
      JWT_REFRESH_EXPIRES_IN: 7d
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TIMEOUT_MS: 120000
      OPENAI_CONCEPT_NOTES_TIMEOUT_MS: 150000
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      MAX_FILE_SIZE: 10485760
      UPLOAD_PATH: uploads/
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"
    networks:
      - aas-network
    stdin_open: true
    tty: true

  # Frontend React Application
  frontend:
    image: node:18-alpine
    container_name: aas-frontend
    working_dir: /app
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:3001
      REACT_APP_ENV: development
      REACT_APP_VERSION: 1.0.0
      REACT_APP_ENABLE_ANALYTICS: false
      REACT_APP_ENABLE_DEBUG_MODE: true
      CHOKIDAR_USEPOLLING: true
      WDS_SOCKET_PORT: 0
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/backend
    depends_on:
      - backend
    command: sh -c "npm install && npx react-scripts start"
    networks:
      - aas-network
    stdin_open: true
    tty: true

networks:
  aas-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
